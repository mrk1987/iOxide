name: Release

on:
  push:
    tags: ["v*"]
    branches: [main]
    paths: [".github/workflows/release.yml"]
  pull_request:
    paths: [".github/workflows/release.yml"]

permissions:
  contents: read

jobs:
  test:
    name: Test release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test -race -count=1 ./...
      - run: go vet ./...

  build:
    needs: test
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="$GITHUB_REF_NAME"
          else
            version="check-${GITHUB_SHA:0:7}"
          fi
          platform="$GOOS"
          if [ "$platform" = "darwin" ]; then platform="macos"; fi
          name="ioxide-${version}-${platform}-${GOARCH}"
          ext=""; [ "$GOOS" = "windows" ] && ext=".exe"
          go build -trimpath -ldflags "-s -w" -o "dist/${name}/ioxide${ext}" ./cmd/ioxide
          cp LICENSE README.md "dist/${name}/"
          mkdir -p "dist/${name}/docs/assets"
          cp docs/CHANGELOG.md "dist/${name}/docs/"
          cp docs/assets/*.png "dist/${name}/docs/assets/"
          mkdir -p "dist/${name}/.github"
          cp .github/SECURITY.md .github/CONTRIBUTING.md "dist/${name}/.github/"
          cd dist
          if [ "$GOOS" = "windows" ]; then zip -r "${name}.zip" "${name}"; else tar czf "${name}.tar.gz" "${name}"; fi
          rm -r "${name}"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  verify-artifacts:
    name: Verify release archives
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Check archive integrity and executables
        shell: bash
        run: |
          shopt -s nullglob
          archives=(dist/*.tar.gz dist/*.zip)
          if [ "${#archives[@]}" -ne 6 ]; then
            echo "Expected six release archives, found ${#archives[@]}"
            exit 1
          fi
          for archive in "${archives[@]}"; do
            case "$archive" in
              *.tar.gz)
                name=$(basename "$archive" .tar.gz)
                tar -tzf "$archive" | grep -Fx "${name}/ioxide"
                ;;
              *.zip)
                name=$(basename "$archive" .zip)
                unzip -tqq "$archive"
                unzip -Z1 "$archive" | grep -Fx "${name}/ioxide.exe"
                ;;
            esac
          done

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: verify-artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
