name: Release

on:
  push:
    tags: ["v*"]
    branches: [main]
    paths: [".github/workflows/release.yml"]
  pull_request:
    paths: [".github/workflows/release.yml"]

permissions:
  contents: read

jobs:
  test:
    name: Test release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - run: go test -race -count=1 ./...
      - run: go vet ./...

  build:
    needs: test
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="$GITHUB_REF_NAME"
          else
            version="check-${GITHUB_SHA:0:7}"
          fi
          platform="$GOOS"
          if [ "$platform" = "darwin" ]; then platform="macos"; fi
          name="ioxide-${version}-${platform}-${GOARCH}"
          ext=""; [ "$GOOS" = "windows" ] && ext=".exe"
          go build -trimpath -ldflags "-s -w" -o "dist/${name}/ioxide${ext}" ./cmd/ioxide
          cp LICENSE README.md "dist/${name}/"
          mkdir -p "dist/${name}/docs/assets"
          cp docs/CHANGELOG.md "dist/${name}/docs/"
          cp docs/assets/*.png "dist/${name}/docs/assets/"
          mkdir -p "dist/${name}/.github"
          cp .github/SECURITY.md .github/CONTRIBUTING.md "dist/${name}/.github/"
          cd dist
          if [ "$GOOS" = "windows" ]; then zip -r "${name}.zip" "${name}"; else tar czf "${name}.tar.gz" "${name}"; fi
          rm -r "${name}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ioxide-cli-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  verify-artifacts:
    name: Verify release archives
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: ioxide-cli-*
          merge-multiple: true
      - name: Check archive integrity and executables
        shell: bash
        run: |
          shopt -s nullglob
          archives=(dist/*.tar.gz dist/*.zip)
          if [ "${#archives[@]}" -ne 6 ]; then
            echo "Expected six release archives, found ${#archives[@]}"
            exit 1
          fi
          for archive in "${archives[@]}"; do
            case "$archive" in
              *.tar.gz)
                name=$(basename "$archive" .tar.gz)
                tar -tzf "$archive" | grep -Fx "${name}/ioxide"
                ;;
              *.zip)
                name=$(basename "$archive" .zip)
                unzip -tqq "$archive"
                unzip -Z1 "$archive" | grep -Fx "${name}/ioxide.exe"
                ;;
            esac
          done

  # The desktop app is built by desktop.yml and published in the same release.
  desktop:
    name: Desktop
    uses: ./.github/workflows/desktop.yml

  verify-desktop:
    name: Verify desktop archives
    needs: desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: ioxide-desktop-*
          merge-multiple: true
      - name: Check archive integrity and executables
        shell: bash
        run: |
          shopt -s nullglob
          cd dist
          archives=(*.tar.gz *.zip)
          if [ "${#archives[@]}" -ne 6 ]; then
            echo "Expected six desktop archives, found ${#archives[@]}"
            exit 1
          fi
          for archive in "${archives[@]}"; do
            case "$archive" in
              *macos*.tar.gz) tar -tzf "$archive" | grep -F "/iOxide.app/Contents/MacOS/ioxide-desktop" ;;
              *.tar.gz) tar -tzf "$archive" | grep -Fx "$(basename "$archive" .tar.gz)/ioxide-desktop" ;;
              *.zip) unzip -tqq "$archive" && unzip -Z1 "$archive" | grep -Fx "$(basename "$archive" .zip)/ioxide-desktop.exe" ;;
            esac
          done

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [verify-artifacts, verify-desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Signed build provenance: `gh attestation verify <file> -R mrk1987/iOxide`.
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: ioxide-*
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          count=$(ls *.tar.gz *.zip | wc -l)
          if [ "$count" -ne 12 ]; then
            echo "Expected twelve archives (CLI and desktop), found $count"
            exit 1
          fi
          sha256sum * > SHA256SUMS
      - name: Attest build provenance
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      # The bundle as a release file, so it can be verified offline
      # (gh attestation verify --bundle) and is found by OpenSSF Scorecard.
      - name: Attach provenance bundle
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE" dist/provenance.intoto.jsonl
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: dist/*
          generate_release_notes: true
          # A tag with a suffix (v1.3.0-beta.1) is a pre-release.
          prerelease: ${{ contains(github.ref_name, '-') }}
