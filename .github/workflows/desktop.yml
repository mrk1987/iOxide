name: Desktop CI

on:
  push:
    branches: [main, feature/desktop-ui]
    tags: ["desktop-v*"]
    paths: ["desktop/**", "internal/**", "go.mod", "go.sum", ".github/workflows/desktop.yml"]
  pull_request:
    paths: ["desktop/**", "internal/**", "go.mod", "go.sum", ".github/workflows/desktop.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop (${{ matrix.platform }}/${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-latest, goos: windows, platform: windows, arch: amd64 }
          - { runner: windows-latest, goos: windows, platform: windows, arch: arm64 }
          - { runner: macos-latest, goos: darwin, platform: macos, arch: amd64 }
          - { runner: macos-latest, goos: darwin, platform: macos, arch: arm64 }
          - { runner: ubuntu-24.04, goos: linux, platform: linux, arch: amd64 }
          - { runner: ubuntu-24.04-arm, goos: linux, platform: linux, arch: arm64 }
    defaults:
      run:
        working-directory: desktop
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: |
            go.sum
            desktop/go.sum
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev libx11-dev
      - name: Test and vet desktop module
        run: |
          go test -count=1 ./...
          go vet ./...
          go mod tidy -diff
      - name: Generate native icons
        run: go run "github.com/wailsapp/wails/v3/cmd/wails3@$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)" generate icons -input frontend/assets/ioxide-icon.png -windowsfilename build/icon.ico -macfilename build/icons.icns
      - name: Windows resources
        if: runner.os == 'Windows'
        run: go run "github.com/wailsapp/wails/v3/cmd/wails3@$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)" generate syso -manifest build/app.manifest -icon build/icon.ico -arch ${{ matrix.arch }} -out rsrc_windows_${{ matrix.arch }}.syso
      - name: Build desktop
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.arch }}
        run: |
          name="ioxide-desktop-${GOOS}-${GOARCH}"
          if [ "$GOOS" = "windows" ]; then
            go build -trimpath -tags production -ldflags '-s -w -H windowsgui' -o "../dist/${name}/ioxide-desktop.exe" .
          elif [ "$GOOS" = "darwin" ]; then
            # The macOS window needs cgo, which Go turns off when the target
            # architecture differs from the runner's.
            export CGO_ENABLED=1
            name="ioxide-desktop-macos-${GOARCH}"
            mkdir -p "../dist/${name}/iOxide.app/Contents/MacOS" "../dist/${name}/iOxide.app/Contents/Resources"
            go build -trimpath -tags production -ldflags '-s -w' -o "../dist/${name}/iOxide.app/Contents/MacOS/ioxide-desktop" .
            cp build/Info.plist "../dist/${name}/iOxide.app/Contents/"
            cp build/icons.icns "../dist/${name}/iOxide.app/Contents/Resources/"
            codesign --force --deep --sign - "../dist/${name}/iOxide.app"
          else
            go build -trimpath -tags production -ldflags '-s -w' -o "../dist/${name}/ioxide-desktop" .
          fi
          cp ../LICENSE ../docs/desktop.md "../dist/${name}/"
          # Archive here so executable bits and the .app bundle survive the
          # artifact upload. A desktop-v1.2.3 tag names the archive v1.2.3.
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#desktop-}"
          else
            version="check-${GITHUB_SHA:0:7}"
          fi
          archive="ioxide-desktop-${version}-${{ matrix.platform }}-${GOARCH}"
          cd ../dist
          mv "${name}" "${archive}"
          if [ "$GOOS" = "windows" ]; then
            7z a -tzip "${archive}.zip" "${archive}"
          else
            tar czf "${archive}.tar.gz" "${archive}"
          fi
          rm -r "${archive}"
      - uses: actions/upload-artifact@v7
        with:
          name: ioxide-desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish desktop pre-release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/desktop-v')
    needs: desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Release title
        id: version
        # desktop-v1.0.0-beta.2 is published as "iOxide Desktop 1.0.0-beta.2".
        run: echo "version=${GITHUB_REF_NAME#desktop-v}" >> "$GITHUB_OUTPUT"
      - name: Verify archives and write checksums
        run: |
          shopt -s nullglob
          cd dist
          archives=(*.tar.gz *.zip)
          if [ "${#archives[@]}" -ne 6 ]; then
            echo "Expected six desktop archives, found ${#archives[@]}"
            exit 1
          fi
          for archive in "${archives[@]}"; do
            case "$archive" in
              *macos*.tar.gz) tar -tzf "$archive" | grep -F "/iOxide.app/Contents/MacOS/ioxide-desktop" ;;
              *.tar.gz) tar -tzf "$archive" | grep -Fx "$(basename "$archive" .tar.gz)/ioxide-desktop" ;;
              *.zip) unzip -tqq "$archive" && unzip -Z1 "$archive" | grep -Fx "$(basename "$archive" .zip)/ioxide-desktop.exe" ;;
            esac
          done
          sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          prerelease: true
          make_latest: false
          name: iOxide Desktop ${{ steps.version.outputs.version }}
